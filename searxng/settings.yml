use_default_settings: true

general:
  instance_name: 'searxng'

search:
  autocomplete: 'google'
  formats:
    - html
    - json

server:
  secret_key: 'a2fb23f1b02e6ee83875b09826990de0f6bd908b6638e8c10277d415f6ab852b' # Is overwritten by ${SEARXNG_SECRET}

outgoing:
  # Vane aborts a SearXNG request after 10s, so answer with whatever engines finished by then
  max_request_timeout: 6.0

engines:
  - name: wolframalpha
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
    inactive: false
  - name: mojeek
    disabled: false
    inactive: false
