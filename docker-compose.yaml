services:
  vane:
    image: itzcrazykns1337/vane:latest
    build:
      context: .
    ports:
      - '3000:3000'
    environment:
      # Next's standalone server binds to $HOSTNAME's IP only; with several networks that may not be the published one
      - HOSTNAME=0.0.0.0
    volumes:
      - data:/home/vane/data
    networks:
      - vane-net
    restart: unless-stopped

networks:
  # Shared with the standalone searxng container; create once with `docker network create vane-net`
  vane-net:
    external: true

volumes:
  data:
    name: 'vane-data'
